name: InstaSwipe
options:
  bundleIdPrefix: com.giacomogrieco
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CBRAP62CDG
    TARGETED_DEVICE_FAMILY: "1"
packages:
  InstaSwipeKit:
    path: Packages/InstaSwipeKit
targets:
  InstaSwipe:
    type: application
    platform: iOS
    sources: [InstaSwipe]
    dependencies:
      - package: InstaSwipeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giacomogrieco.InstaSwipe
        INFOPLIST_FILE: InstaSwipe/Info.plist
        CODE_SIGN_ENTITLEMENTS: InstaSwipe/InstaSwipe.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  InstaSwipeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InstaSwipeTests]
    dependencies:
      - target: InstaSwipe
      - package: InstaSwipeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giacomogrieco.InstaSwipeTests
        GENERATE_INFOPLIST_FILE: YES
  InstaSwipeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InstaSwipeUITests
        optional: true
    dependencies:
      - target: InstaSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giacomogrieco.InstaSwipeUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InstaSwipe:
    build:
      targets:
        InstaSwipe: all
    test:
      targets: [InstaSwipeTests, InstaSwipeUITests]
